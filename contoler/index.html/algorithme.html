
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quiz MyCulina</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="algorithme.css">
</head>

<body>

    <main class="container py-4">

        <a href="page_recette.html" class="text-secondary text-decoration-none">
            <i class="bi bi-arrow-left"></i>
            Retour aux recettes
        </a>

        <h1 class="h2 fw-bold mt-3">
            Votre profil cuisine
        </h1>

        <p class="text-secondary">
            Trois questions pour ne voir que les recettes qui vous conviennent.
        </p>

        <div id="quiz" class="quiz-box">

            <section class="card rounded-4 p-3 mb-3">

                <h2 class="h5">
                    1. Quels allergènes devons-nous exclure ?
                </h2>

                <div class="d-flex flex-wrap gap-2" id="q-allergenes"></div>

            </section>

            <section class="card rounded-4 p-3 mb-3">

                <h2 class="h5">
                    2. Quel budget maximum par personne ?
                </h2>

                <div class="d-flex flex-wrap gap-2" id="q-budget"></div>

            </section>

            <section class="card rounded-4 p-3 mb-4">

                <h2 class="h5">
                    3. De quel matériel disposez-vous ?
                </h2>

                <div class="d-flex flex-wrap gap-2" id="q-materiel"></div>

            </section>

            <button class="btn btn-success btn-lg rounded-pill w-100" id="valider">
                Voir mes recettes
            </button>

            <p class="text-center small text-secondary mt-2" id="compte"></p>

        </div>

    </main>

    <script src="recettes.js"></script>

    <script>

        const choix = {

            allergenes: [
                ['gluten', 'Gluten'],
                ['lait', 'Lait'],
                ['oeufs', 'Œufs'],
                ['poisson', 'Poisson'],
                ['noix', 'Fruits à coque']
            ],

            budget: [
                [3, 'Jusqu\'à 3 €'],
                [5, 'Jusqu\'à 5 €'],
                [8, 'Jusqu\'à 8 €']
            ],

            materiel: [
                ['four', 'Four'],
                ['plaques', 'Plaques de cuisson']
            ]

        };

        let sauve = null;

        try {
            sauve = JSON.parse(localStorage.getItem('mc_quiz'));
        } catch (e) {}


        // Fabrique les boutons de réponse (cases à cocher ou boutons radio)

        function boutons(nom, type, valeurs, coches) {

            document.getElementById('q-' + nom).innerHTML = valeurs.map(([v, l], i) => {

                const on = coches.includes(v) ? 'checked' : '';

                return `
                    <input
                        type="${type}"
                        class="btn-check"
                        name="${nom}"
                        id="${nom}${i}"
                        value="${v}"
                        ${on}
                    >

                    <label class="btn btn-outline-success rounded-pill" for="${nom}${i}">
                        ${l}
                    </label>
                `;

            }).join('');

        }


        boutons('allergenes', 'checkbox', choix.allergenes, sauve ? sauve.allergenes : []);

        boutons('budget', 'radio', choix.budget, [sauve ? sauve.budget : 8]);

        boutons('materiel', 'checkbox', choix.materiel, sauve ? sauve.materiel : ['four', 'plaques']);


        function lire() {

            const vals = n => [
                ...document.querySelectorAll(`input[name=${n}]:checked`)
            ].map(i => i.value);

            return {

                allergenes: vals('allergenes'),

                budget: Number(vals('budget')[0]),

                materiel: vals('materiel')

            };

        }


        function maj() {

            const n = filtrerRecettes(RECETTES, lire()).length;

            document.getElementById('compte').textContent =
                n + ' recette' + (n > 1 ? 's' : '') +
                ' correspondante' + (n > 1 ? 's' : '');

        }


        document.getElementById('quiz').addEventListener('change', maj);


        document.getElementById('valider').onclick = () => {

            localStorage.setItem('mc_quiz', JSON.stringify(lire()));

            location.href = 'page_recette.html';

        };


        maj();

    </script>

</body>

</html>
